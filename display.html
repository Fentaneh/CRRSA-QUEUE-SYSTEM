<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA - Now Serving</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071a2b;
    color:white;
    text-align:center;
}

header{
    background:#004d99;
    padding:25px;
}

header h1{
    margin:0;
    font-size:50px;
}

header p{
    margin:8px;
    font-size:22px;
}

.main{
    min-height:75vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.title{
    font-size:45px;
    margin-bottom:20px;
}

.amharic{
    font-size:30px;
    margin-bottom:25px;
}

#number{
    font-size:150px;
    font-weight:bold;
    color:#ffd700;
    margin:10px;
}

#counter{
    font-size:50px;
    margin:15px;
}

#counterAm{
    font-size:32px;
}

.status{
    font-size:25px;
    margin-top:25px;
}

button{
    padding:15px 25px;
    margin:8px;
    border:none;
    border-radius:8px;
    background:#004d99;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}

</style>
</head>


<body>

<header>

    <h1>CRRSA</h1>

    <p>
        Queue Management System
    </p>

    <p>
        የተራ አስተዳደር ስርዓት
    </p>

</header>


<div class="main">

    <div class="title">
        NOW SERVING
    </div>

    <div class="amharic">
        አሁን የሚጠራው
    </div>


    <div id="number">
        ---
    </div>


    <div id="counter">
        Please wait
    </div>

    <div id="counterAm">
        እባክዎ ይጠብቁ
    </div>


    <div class="status">
        Please go to the displayed counter
    </div>

    <div class="status">
        እባክዎ ወደተጠቀሰው ቆጣሪ ይሂዱ
    </div>


    <div>

        <button onclick="testEnglish()">
            🔊 English
        </button>

        <button onclick="testAmharic()">
            🔊 አማርኛ
        </button>

    </div>

</div>


<script type="module">

import {
    db,
    ref,
    onValue
} from "./firebase.js";


const numberDisplay =
    document.getElementById("number");

const counterDisplay =
    document.getElementById("counter");

const counterAmDisplay =
    document.getElementById("counterAm");


/* =========================
   FIREBASE LIVE DATA
========================= */

onValue(
    ref(db, "queue/current"),
    (snapshot) => {

        const current =
            snapshot.val();


        if(
            !current ||
            !current.number
        ){

            numberDisplay.innerText =
                "---";

            counterDisplay.innerText =
                "Please wait";

            counterAmDisplay.innerText =
                "እባክዎ ይጠብቁ";

            return;
        }


        const number =
            current.number;

        const counter =
            current.counter;


        numberDisplay.innerText =
            number;


        counterDisplay.innerText =
            "Please go to Counter " +
            counter;


        counterAmDisplay.innerText =
            "እባክዎ ወደ ቆጣሪ " +
            counter +
            " ይሂዱ";


        /* Voice announcement */

        speakEnglish(
            "Number " +
            number.replace("A","") +
            ". Please go to counter " +
            counter
        );

    }
);


/* =========================
   ENGLISH VOICE
========================= */

function speakEnglish(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "en-US";

    speech.rate =
        0.85;

    speech.pitch =
        1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   BUTTON TEST
========================= */

window.testEnglish =
function(){

    speakEnglish(
        "This is the CRRSA queue system"
    );

};


window.testAmharic =
function(){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    const speech =
        new SpeechSynthesisUtterance(
            "እባክዎ ወደ ቆጣሪ ይሂዱ"
        );


    speech.lang =
        "am-ET";

    speech.rate =
        0.8;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        speech
    );

};

</script>

</body>
</html>
