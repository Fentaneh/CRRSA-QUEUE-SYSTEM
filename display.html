<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA - Now Serving</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071a2b;
    color:white;
    text-align:center;
}

header{
    background:#004d99;
    padding:25px;
}

header h1{
    margin:0;
    font-size:55px;
}

header p{
    margin:8px;
    font-size:22px;
}

.main{
    min-height:75vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.title{
    font-size:45px;
    font-weight:bold;
}

.amharic{
    font-size:30px;
    margin:10px 0 25px;
}

#number{
    font-size:160px;
    font-weight:bold;
    color:#ffd700;
    margin:10px;
}

#counter{
    font-size:50px;
    font-weight:bold;
    margin:15px;
}

#counterAm{
    font-size:32px;
}

#status{
    font-size:24px;
    margin-top:25px;
}

button{
    padding:15px 25px;
    margin:20px 8px;
    border:0;
    border-radius:8px;
    background:#004d99;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}
</style>
</head>

<body>

<header>
    <h1>CRRSA</h1>
    <p>Queue Management System</p>
    <p>የተራ አስተዳደር ስርዓት</p>
</header>

<div class="main">

    <div class="title">
        NOW SERVING
    </div>

    <div class="amharic">
        አሁን የሚጠራው
    </div>

    <div id="number">---</div>

    <div id="counter">
        Please Wait
    </div>

    <div id="counterAm">
        እባክዎ ይጠብቁ
    </div>

    <div id="status">
        Please go to the displayed counter
    </div>

    <button id="englishBtn">
        🔊 English
    </button>

    <button id="amharicBtn">
        🔊 አማርኛ
    </button>

</div>


<script type="module">

import {
    db,
    ref,
    onValue
} from "./firebase.js";


const numberDisplay =
    document.getElementById("number");

const counterDisplay =
    document.getElementById("counter");

const counterAmDisplay =
    document.getElementById("counterAm");

const statusDisplay =
    document.getElementById("status");

const englishBtn =
    document.getElementById("englishBtn");

const amharicBtn =
    document.getElementById("amharicBtn");


let currentNumber = "";
let currentCounter = "";

let lastAnnouncement = "";


/* =========================
   FIREBASE LIVE DISPLAY
========================= */

onValue(
    ref(db, "queue/current"),
    (snapshot) => {

        const current =
            snapshot.val();

        if(
            !current ||
            !current.number
        ){

            currentNumber = "";
            currentCounter = "";

            numberDisplay.innerText =
                "---";

            counterDisplay.innerText =
                "Please Wait";

            counterAmDisplay.innerText =
                "እባክዎ ይጠብቁ";

            statusDisplay.innerText =
                "Please go to the displayed counter";

            return;
        }


        currentNumber =
            current.number;

        currentCounter =
            current.counter;


        numberDisplay.innerText =
            currentNumber;


        counterDisplay.innerText =
            "Please go to Counter " +
            currentCounter;


        counterAmDisplay.innerText =
            "እባክዎ ወደ ቆጣሪ " +
            currentCounter +
            " ይሂዱ";


        statusDisplay.innerText =
            "Please go to the displayed counter";


        /*
         * Announce only when the number changes.
         */

        const announcement =
            currentNumber +
            "-" +
            currentCounter;


        if(
            announcement !== lastAnnouncement
        ){

            lastAnnouncement =
                announcement;

            speakEnglish(
                "Number " +
                currentNumber.replace("A","") +
                ". Please go to counter " +
                currentCounter
            );
        }

    },
    (error) => {

        console.error(error);

        statusDisplay.innerText =
            "Firebase connection error";

    }
);


/* =========================
   ENGLISH VOICE
========================= */

function speakEnglish(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang =
        "en-US";

    speech.rate =
        0.85;

    speech.pitch =
        1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        speech
    );
}


/* =========================
   AMHARIC VOICE
========================= */

function speakAmharic(){

    if(
        !currentNumber ||
        !currentCounter
    ){
        return;
    }

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    const text =
        "ቁጥር " +
        currentNumber.replace("A","") +
        " እባክዎ ወደ ቆጣሪ " +
        currentCounter +
        " ይሂዱ";


    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang =
        "am-ET";

    speech.rate =
        0.8;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        speech
    );
}


/* =========================
   BUTTONS
========================= */

englishBtn.addEventListener(
    "click",
    () => {

        speakEnglish(
            "Number " +
            currentNumber.replace("A","") +
            ". Please go to counter " +
            currentCounter
        );

    }
);


amharicBtn.addEventListener(
    "click",
    () => {

        speakAmharic();

    }
);

</script>

</body>
</html>
