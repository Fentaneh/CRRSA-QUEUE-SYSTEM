<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA Queue</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f2f5f8;
    margin:0;
}

header{
    background:#004d99;
    color:white;
    padding:25px;
}

h1{
    margin:0;
}

.card{
    background:white;
    width:90%;
    max-width:500px;
    margin:50px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #aaa;
}

button{
    background:#004d99;
    color:white;
    border:none;
    padding:18px 30px;
    margin:10px;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

#number{
    font-size:60px;
    font-weight:bold;
    color:#004d99;
    margin:25px;
}
</style>
</head>

<body>

<header>
    <h1>CRRSA</h1>
    <p>Queue Management System</p>
    <p>የተራ አስተዳደር ስርዓት</p>
</header>

<div class="card">

    <h2>Take Your Number</h2>
    <h2>ተራ ቁጥር ይውሰዱ</h2>

    <button id="takeBtn">
        TAKE NUMBER<br>
        ተራ ቁጥር ይውሰዱ
    </button>

    <div id="number"></div>

</div>


<script type="module">

import {
    db,
    ref,
    get,
    set,
    runTransaction
} from "./firebase.js";


const takeBtn = document.getElementById("takeBtn");
const numberDisplay = document.getElementById("number");


takeBtn.addEventListener("click", async () => {

    try {

        const counterRef = ref(db, "queue/lastIssued");

        const result = await runTransaction(
            counterRef,
            current => (current || 0) + 1
        );

        if (!result.committed) {
            alert("Please try again.");
            return;
        }

        const seq = result.snapshot.val();

        const number =
            "A" + String(seq).padStart(3, "0");


        await set(
            ref(db, "queue/tickets/" + seq),
            {
                number: number,
                seq: seq,
                status: "waiting",
                createdAt: Date.now()
            }
        );


        numberDisplay.innerHTML =
            "Your Number<br>" +
            number +
            "<br><small>እርስዎ የወሰዱት ቁጥር</small>";


    } catch(error) {

        console.error(error);

        alert(
            "Unable to connect to queue system."
        );

    }

});

</script>

</body>
</html>
