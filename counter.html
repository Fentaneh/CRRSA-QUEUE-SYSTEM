<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA Counter</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f2f5f8;
    margin:0;
}

header{
    background:#004d99;
    color:white;
    padding:20px;
}

.card{
    background:white;
    width:90%;
    max-width:650px;
    margin:30px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #aaa;
}

select{
    padding:12px;
    font-size:20px;
    margin:15px;
}

#current{
    font-size:70px;
    font-weight:bold;
    color:#004d99;
    margin:25px;
}

button{
    padding:18px 30px;
    margin:8px;
    border:none;
    border-radius:8px;
    font-size:20px;
    color:white;
    background:#004d99;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

#status{
    margin:20px;
    font-size:18px;
}
</style>
</head>

<body>

<header>
    <h1>CRRSA</h1>
    <h2>Counter Service</h2>
    <p>የቆጣሪ አገልግሎት</p>
</header>

<div class="card">

    <h2>Counter / ቆጣሪ</h2>

    <select id="counter">
        <option value="1">Counter 1 / ቆጣሪ 1</option>
        <option value="2">Counter 2 / ቆጣሪ 2</option>
        <option value="3">Counter 3 / ቆጣሪ 3</option>
        <option value="4">Counter 4 / ቆጣሪ 4</option>
    </select>

    <div id="current">---</div>

    <button id="nextBtn">
        NEXT<br>ቀጣይ
    </button>

    <button id="recallBtn">
        RECALL<br>እንደገና ጥራ
    </button>

    <button id="resetBtn">
        RESET<br>ዳግም ጀምር
    </button>

    <div id="status"></div>

</div>


<script type="module">

import {
    db,
    ref,
    get,
    update,
    runTransaction,
    onValue
} from "./firebase.js";


const counterSelect =
    document.getElementById("counter");

const currentDisplay =
    document.getElementById("current");

const statusDisplay =
    document.getElementById("status");

const nextBtn =
    document.getElementById("nextBtn");

const recallBtn =
    document.getElementById("recallBtn");

const resetBtn =
    document.getElementById("resetBtn");


let lastCalled = null;


/* -------------------------
   NEXT
------------------------- */

nextBtn.addEventListener("click", async () => {

    try {

        const queueRef =
            ref(db, "queue");

        const snapshot =
            await get(queueRef);

        const data =
            snapshot.val() || {};

        const lastIssued =
            data.lastIssued || 0;

        let nextToCall =
            data.nextToCall || 1;


        if (nextToCall > lastIssued) {

            statusDisplay.innerText =
                "No waiting customers. / የሚጠብቅ ደንበኛ የለም።";

            return;
        }


        const ticketRef =
            ref(
                db,
                "queue/tickets/" + nextToCall
            );

        const ticketSnapshot =
            await get(ticketRef);

        if (!ticketSnapshot.exists()) {

            await update(queueRef, {
                nextToCall: nextToCall + 1
            });

            return;
        }


        const ticket =
            ticketSnapshot.val();


        const counter =
            counterSelect.value;


        await update(
            ref(db, "queue"),
            {
                nextToCall: nextToCall + 1,

                current: {
                    number: ticket.number,
                    counter: counter,
                    calledAt: Date.now()
                }
            }
        );


        await update(ticketRef, {
            status: "called",
            counter: counter,
            calledAt: Date.now()
        });


        currentDisplay.innerText =
            ticket.number;

        lastCalled =
            ticket.number;


        speakEnglish(
            "Number " +
            ticket.number.replace("A","") +
            ". Please go to counter " +
            counter
        );


        statusDisplay.innerText =
            "Called / ተጠርቷል";


    } catch(error) {

        console.error(error);

        statusDisplay.innerText =
            "Error connecting to Firebase.";

    }

});


/* -------------------------
   RECALL
------------------------- */

recallBtn.addEventListener("click", () => {

    if (!lastCalled) {

        statusDisplay.innerText =
            "No number to recall.";

        return;
    }


    const counter =
        counterSelect.value;


    speakEnglish(
        "Number " +
        lastCalled.replace("A","") +
        ". Please go to counter " +
        counter
    );

});


/* -------------------------
   RESET
------------------------- */

resetBtn.addEventListener("click", async () => {

    const answer =
        confirm(
            "Reset queue? / የተራ ስርዓቱን ዳግም ጀምር?"
        );

    if (!answer) return;


    await update(
        ref(db, "queue"),
        {
            lastIssued: 0,
            nextToCall: 1,

            current: {
                number: "",
                counter: "",
                calledAt: 0
            },

            tickets: {}
        }
    );


    currentDisplay.innerText =
        "---";

    statusDisplay.innerText =
        "Queue reset. / ተራው ዳግም ተጀምሯል።";

});


/* -------------------------
   LIVE CURRENT NUMBER
------------------------- */

onValue(
    ref(db, "queue/current"),
    snapshot => {

        const current =
            snapshot.val();

        if (!current || !current.number) {

            currentDisplay.innerText =
                "---";

            return;
        }


        currentDisplay.innerText =
            current.number;

    }
);


/* -------------------------
   ENGLISH VOICE
------------------------- */

function speakEnglish(text){

    if (!("speechSynthesis" in window))
        return;

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
