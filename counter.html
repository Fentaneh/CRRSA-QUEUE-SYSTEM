<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA Counter</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f2f5f8;
}

header{
    background:#004d99;
    color:white;
    padding:25px;
}

header h1{
    margin:0;
    font-size:42px;
}

header h2{
    margin:8px;
}

.card{
    background:white;
    width:90%;
    max-width:700px;
    margin:35px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #aaa;
}

select{
    padding:14px;
    font-size:20px;
    margin:15px;
    border-radius:8px;
}

#current{
    font-size:90px;
    font-weight:bold;
    color:#004d99;
    margin:30px;
}

button{
    padding:18px 30px;
    margin:8px;
    border:0;
    border-radius:8px;
    font-size:20px;
    color:white;
    background:#004d99;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#status{
    margin:20px;
    font-size:18px;
    min-height:25px;
}

</style>
</head>


<body>

<header>

<h1>CRRSA</h1>

<h2>Counter Service</h2>

<p>የቆጣሪ አገልግሎት</p>

</header>


<div class="card">

<h2>Counter / ቆጣሪ</h2>


<select id="counter">

<option value="1">
Counter 1 / ቆጣሪ 1
</option>

<option value="2">
Counter 2 / ቆጣሪ 2
</option>

<option value="3">
Counter 3 / ቆጣሪ 3
</option>

<option value="4">
Counter 4 / ቆጣሪ 4
</option>

</select>


<div id="current">
---
</div>


<button id="nextBtn">
NEXT<br>
ቀጣይ
</button>


<button id="recallBtn">
RECALL<br>
እንደገና ጥራ
</button>


<button id="resetBtn">
RESET<br>
ዳግም ጀምር
</button>


<div id="status"></div>

</div>



<script type="module">

import {

    db,
    ref,
    onValue,
    runTransaction

} from "./firebase.js";


const counterSelect =
    document.getElementById("counter");


const currentDisplay =
    document.getElementById("current");


const statusDisplay =
    document.getElementById("status");


const nextBtn =
    document.getElementById("nextBtn");


const recallBtn =
    document.getElementById("recallBtn");


const resetBtn =
    document.getElementById("resetBtn");


let lastCalled = "";



/* =========================
   NEXT CUSTOMER
========================= */

nextBtn.addEventListener(
    "click",
    async function(){

        nextBtn.disabled = true;

        statusDisplay.innerText =
            "Calling next customer... / ቀጣዩን ደንበኛ በመጥራት ላይ...";


        try{

            const queueRef =
                ref(db,"queue");


            const result =
                await runTransaction(
                    queueRef,
                    function(queue){

                        if(!queue){

                            return queue;
                        }


                        const lastIssued =
                            Number(queue.lastIssued || 0);


                        const nextToCall =
                            Number(queue.nextToCall || 1);


                        if(
                            nextToCall >
                            lastIssued
                        ){

                            return;
                        }


                        if(
                            !queue.tickets ||
                            !queue.tickets[nextToCall]
                        ){

                            return;
                        }


                        const ticket =
                            queue.tickets[nextToCall];


                        const counter =
                            counterSelect.value;


                        ticket.status =
                            "called";


                        ticket.counter =
                            counter;


                        ticket.calledAt =
                            Date.now();


                        queue.tickets[nextToCall] =
                            ticket;


                        queue.nextToCall =
                            nextToCall + 1;


                        queue.current = {

                            number:
                                ticket.number,

                            counter:
                                counter,

                            calledAt:
                                Date.now()

                        };


                        return queue;

                    }
                );


            if(!result.committed){

                statusDisplay.innerText =
                    "No waiting customer / የሚጠብቅ ደንበኛ የለም";

                nextBtn.disabled = false;

                return;

            }


            const queue =
                result.snapshot.val();


            const current =
                queue.current;


            if(
                !current ||
                !current.number
            ){

                statusDisplay.innerText =
                    "No customer available.";

                nextBtn.disabled = false;

                return;

            }


            currentDisplay.innerText =
                current.number;


            lastCalled =
                current.number;


            statusDisplay.innerText =
                "Called / ተጠርቷል";


            speakEnglish(

                "Number " +

                current.number.replace("A","") +

                ". Please go to counter " +

                current.counter

            );


        }
        catch(error){

            console.error(error);


            statusDisplay.innerText =
                "Connection error / የግንኙነት ችግር";


        }


        nextBtn.disabled = false;

    }
);



/* =========================
   RECALL
========================= */

recallBtn.addEventListener(
    "click",
    function(){

        if(!lastCalled){

            statusDisplay.innerText =
                "No number to recall / የሚደገም ቁጥር የለም";

            return;

        }


        const counter =
            counterSelect.value;


        speakEnglish(

            "Number " +

            lastCalled.replace("A","") +

            ". Please go to counter " +

            counter

        );


        statusDisplay.innerText =
            "Recalled / እንደገና ተጠርቷል";

    }
);



/* =========================
   RESET
========================= */

resetBtn.addEventListener(
    "click",
    async function(){

        const answer =
            confirm(

                "Reset the entire queue?\n\n" +

                "የተራ ስርዓቱን ሙሉ በሙሉ " +
                "ዳግም ማስጀመር ይፈልጋሉ?"

            );


        if(!answer){

            return;

        }


        try{

            await runTransaction(

                ref(db,"queue"),

                function(){

                    return {

                        lastIssued:0,

                        nextToCall:1,

                        current:{

                            number:"",
                            counter:"",
                            calledAt:0

                        },

                        tickets:{}

                    };

                }

            );


            currentDisplay.innerText =
                "---";


            lastCalled =
                "";


            statusDisplay.innerText =
                "Queue reset / ተራው ዳግም ተጀምሯል";


        }
        catch(error){

            console.error(error);


            statusDisplay.innerText =
                "Reset failed / ዳግም ማስጀመር አልተሳካም";

        }

    }
);



/* =========================
   LIVE CURRENT NUMBER
========================= */

onValue(

    ref(db,"queue/current"),

    function(snapshot){

        const current =
            snapshot.val();


        if(
            !current ||
            !current.number
        ){

            currentDisplay.innerText =
                "---";

            return;

        }


        currentDisplay.innerText =
            current.number;

    },

    function(error){

        console.error(error);

        statusDisplay.innerText =
            "Firebase connection error";

    }

);



/* =========================
   ENGLISH VOICE
========================= */

function speakEnglish(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "en-US";


    speech.rate =
        0.85;


    speech.pitch =
        1;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        speech
    );

}

</script>

</body>
</html>
