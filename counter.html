<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CRRSA Counter</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f2f5f8;
}

header{
    background:#004d99;
    color:white;
    padding:25px;
}

header h1{
    margin:0;
    font-size:42px;
}

header h2{
    margin:8px;
}

.card{
    background:white;
    width:90%;
    max-width:700px;
    margin:35px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #aaa;
}

#counterTitle{
    font-size:28px;
    margin-bottom:20px;
}

#current{
    font-size:90px;
    font-weight:bold;
    color:#004d99;
    margin:30px;
}

button{
    padding:18px 30px;
    margin:8px;
    border:0;
    border-radius:8px;
    font-size:20px;
    color:white;
    background:#004d99;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#status{
    margin:20px;
    font-size:20px;
    min-height:35px;
}

</style>

</head>


<body>


<header>

<h1>CRRSA</h1>

<h2>Counter Service</h2>

<p>የቆጣሪ አገልግሎት</p>

</header>


<div class="card">


<div id="counterTitle">
Counter
</div>


<div id="current">
---
</div>


<button id="nextBtn">

NEXT
<br>

ቀጣይ

</button>


<button id="recallBtn">

RECALL
<br>

እንደገና ጥራ

</button>


<button id="resetBtn">

RESET
<br>

ዳግም ጀምር

</button>


<div id="status">

READY / ዝግጁ

</div>


</div>



<script type="module">


import {

    db,
    ref,
    get,
    update,
    onValue,
    runTransaction

} from "./firebase.js";



const currentDisplay =
document.getElementById("current");


const statusDisplay =
document.getElementById("status");


const nextBtn =
document.getElementById("nextBtn");


const recallBtn =
document.getElementById("recallBtn");


const resetBtn =
document.getElementById("resetBtn");



/* =====================================
   COUNTER NUMBER
===================================== */


const params =
new URLSearchParams(window.location.search);


let counter =
params.get("counter") || "1";


document.getElementById("counterTitle").innerHTML =
"Counter " + counter +
" / ቆጣሪ " + counter;



/* =====================================
   LAST CALLED
===================================== */


let lastCalled = "";



/* =====================================
   NEXT CUSTOMER
===================================== */


nextBtn.addEventListener(
"click",
async () => {


    nextBtn.disabled = true;


    statusDisplay.innerText =
    "Calling next customer... / ቀጣዩን ደንበኛ በመጥራት ላይ...";


    try{


        const queueRef =
        ref(db,"queue");


        const result =
        await runTransaction(
        queueRef,


        (queue) => {


            if(!queue){

                return;

            }


            if(!queue.tickets){

                return;

            }


            const lastIssued =
            Number(queue.lastIssued || 0);


            let nextToCall =
            Number(queue.nextToCall || 1);


            /*
            Find the FIRST waiting ticket
            */


            while(
                nextToCall <= lastIssued
            ){


                const ticket =
                queue.tickets[nextToCall];


                if(
                    ticket &&
                    ticket.status === "waiting"
                ){

                    break;

                }


                nextToCall++;

            }



            /*
            No waiting ticket
            */


            if(
                nextToCall > lastIssued
            ){

                return;

            }



            const ticket =
            queue.tickets[nextToCall];


            if(!ticket){

                return;

            }



            const now =
            Date.now();



            /*
            CALL TICKET
            */


            ticket.status =
            "called";


            ticket.counter =
            counter;


            ticket.calledAt =
            now;



            queue.tickets[nextToCall] =
            ticket;



            /*
            MOVE TO NEXT TICKET
            */


            queue.nextToCall =
            nextToCall + 1;



            /*
            CURRENT NUMBER FOR TV
            */


            queue.current = {

                number:
                ticket.number,

                counter:
                counter,

                calledAt:
                now

            };


            return queue;

        });



        /*
        TRANSACTION FAILED
        */


        if(!result.committed){


            const snapshot =
            await get(queueRef);


            const queue =
            snapshot.val();



            let waitingFound =
            false;


            if(
                queue &&
                queue.tickets
            ){


                const lastIssued =
                Number(queue.lastIssued || 0);


                for(
                    let i=1;
                    i<=lastIssued;
                    i++
                ){


                    const ticket =
                    queue.tickets[i];


                    if(
                        ticket &&
                        ticket.status === "waiting"
                    ){

                        waitingFound =
                        true;

                        break;

                    }

                }

            }



            if(waitingFound){

                statusDisplay.innerText =
                "Please press NEXT again / እባክዎ NEXT እንደገና ይጫኑ";

            }
            else{

                statusDisplay.innerText =
                "Queue is empty / ተራው ባዶ ነው";

            }


            return;

        }



        /*
        GET CURRENT
        */


        const queue =
        result.snapshot.val();


        const current =
        queue.current;



        if(
            !current ||
            !current.number
        ){

            statusDisplay.innerText =
            "Queue is empty / ተራው ባዶ ነው";

            return;

        }



        /*
        SHOW NUMBER
        */


        currentDisplay.innerText =
        current.number;


        lastCalled =
        current.number;



        statusDisplay.innerText =
        "Called / ተጠርቷል";


        /*
        VOICE
        */


        speakEnglish(

            "Number " +

            current.number.replace(
                "A",
                ""
            ) +

            ". Please go to counter " +

            current.counter

        );


    }

    catch(error){

        console.error(error);


        statusDisplay.innerText =
        "Connection error / የግንኙነት ችግር";

    }


    nextBtn.disabled = false;

});



/* =====================================
   RECALL
===================================== */


recallBtn.addEventListener(
"click",
() => {


    if(!lastCalled){


        statusDisplay.innerText =
        "No number to recall / የሚደገም ቁጥር የለም";


        return;

    }



    speakEnglish(

        "Number " +

        lastCalled.replace(
            "A",
            ""
        ) +

        ". Please go to counter " +

        counter

    );


    statusDisplay.innerText =
    "Recalled / እንደገና ተጠርቷል";

});



/* =====================================
   RESET
===================================== */


resetBtn.addEventListener(
"click",
async () => {


    const answer =
    confirm(

        "Reset entire queue?\n\n" +

        "የተራ ስርዓቱን ሙሉ በሙሉ " +

        "ዳግም ማስጀመር ይፈልጋሉ?"

    );


    if(!answer){

        return;

    }



    try{


        await update(
        ref(db,"queue"),

        {

            lastIssued:0,

            nextToCall:1,

            current:{

                number:"",

                counter:"",

                calledAt:0

            },

            tickets:{}

        });



        currentDisplay.innerText =
        "---";


        lastCalled =
        "";


        statusDisplay.innerText =
        "Queue reset / ተራው ዳግም ተጀምሯል";


    }

    catch(error){

        console.error(error);


        statusDisplay.innerText =
        "Reset failed / ዳግም ማስጀመር አልተሳካም";

    }

});



/* =====================================
   LIVE CURRENT NUMBER
===================================== */


onValue(

    ref(
        db,
        "queue/current"
    ),

    (snapshot) => {


        const current =
        snapshot.val();



        if(
            !current ||
            !current.number
        ){

            currentDisplay.innerText =
            "---";

            return;

        }



        currentDisplay.innerText =
        current.number;

    }

);



/* =====================================
   ENGLISH VOICE
===================================== */


function speakEnglish(text){


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }



    const speech =
    new SpeechSynthesisUtterance(
        text
    );


    speech.lang =
    "en-US";


    speech.rate =
    0.85;


    speech.pitch =
    1;



    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        speech
    );

}


</script>


</body>

</html>
