<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRRSA Counter</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f2f5f8;
}

header{
    background:#004d99;
    color:white;
    padding:25px;
}

.card{
    background:white;
    width:90%;
    max-width:650px;
    margin:35px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #aaa;
}

select{
    padding:12px;
    font-size:20px;
    margin:15px;
}

#current{
    font-size:80px;
    font-weight:bold;
    color:#004d99;
    margin:30px;
}

button{
    padding:18px 30px;
    margin:8px;
    border:0;
    border-radius:8px;
    font-size:20px;
    color:white;
    background:#004d99;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

#status{
    margin:20px;
    font-size:18px;
}
</style>
</head>

<body>

<header>
    <h1>CRRSA</h1>
    <h2>Counter Service</h2>
    <p>የቆጣሪ አገልግሎት</p>
</header>

<div class="card">

    <h2>Counter / ቆጣሪ</h2>

    <select id="counter">
        <option value="1">Counter 1 / ቆጣሪ 1</option>
        <option value="2">Counter 2 / ቆጣሪ 2</option>
        <option value="3">Counter 3 / ቆጣሪ 3</option>
        <option value="4">Counter 4 / ቆጣሪ 4</option>
    </select>

    <div id="current">---</div>

    <button id="nextBtn">
        NEXT<br>ቀጣይ
    </button>

    <button id="recallBtn">
        RECALL<br>እንደገና ጥራ
    </button>

    <button id="resetBtn">
        RESET<br>ዳግም ጀምር
    </button>

    <div id="status"></div>

</div>

<script type="module">

import {
    db,
    ref,
    get,
    update,
    runTransaction,
    onValue
} from "./firebase.js";


const counterSelect =
    document.getElementById("counter");

const currentDisplay =
    document.getElementById("current");

const statusDisplay =
    document.getElementById("status");

const nextBtn =
    document.getElementById("nextBtn");

const recallBtn =
    document.getElementById("recallBtn");

const resetBtn =
    document.getElementById("resetBtn");


let lastCalled = "";


/* =========================
   NEXT CUSTOMER
========================= */

nextBtn.addEventListener("click", async () => {

    try {

        nextBtn.disabled = true;

        const queueRef =
            ref(db, "queue");

        const snapshot =
            await get(queueRef);

        const data =
            snapshot.val() || {};

        const lastIssued =
            Number(data.lastIssued || 0);

        const nextToCall =
            Number(data.nextToCall || 1);


        if (nextToCall > lastIssued) {

            statusDisplay.innerText =
                "No waiting customers / የሚጠብቅ ደንበኛ የለም";

            nextBtn.disabled = false;

            return;
        }


        const ticketRef =
            ref(
                db,
                "queue/tickets/" + nextToCall
            );


        const ticketSnapshot =
            await get(ticketRef);


        if (!ticketSnapshot.exists()) {

            await update(queueRef, {
                nextToCall: nextToCall + 1
            });

            nextBtn.disabled = false;

            return;
        }


        const ticket =
            ticketSnapshot.val();

        const counter =
            counterSelect.value;


        /*
         * Move queue pointer.
         * Transaction prevents two counters
         * from claiming the same number.
         */

        const claimRef =
            ref(db, "queue/nextToCall");


        const result =
            await runTransaction(
                claimRef,
                current => {

                    const value =
                        Number(current || 1);

                    if (value !== nextToCall) {
                        return;
                    }

                    return value + 1;
                }
            );


        if (!result.committed) {

            statusDisplay.innerText =
                "Another counter already called this number.";

            nextBtn.disabled = false;

            return;
        }


        const now =
            Date.now();


        await update(
            ref(db, "queue"),
            {
                current: {
                    number: ticket.number,
                    counter: counter,
                    calledAt: now
                }
            }
        );


        await update(ticketRef, {
            status: "called",
            counter: counter,
            calledAt: now
        });


        currentDisplay.innerText =
            ticket.number;

        lastCalled =
            ticket.number;


        statusDisplay.innerText =
            "Called / ተጠርቷል";


        speakEnglish(
            "Number " +
            ticket.number.replace("A","") +
            ". Please go to counter " +
            counter
        );


    } catch(error) {

        console.error(error);

        statusDisplay.innerText =
            "Connection error / የግንኙነት ችግር";

    }


    nextBtn.disabled = false;

});


/* =========================
   RECALL
========================= */

recallBtn.addEventListener("click", () => {

    if (!lastCalled) {

        statusDisplay.innerText =
            "No number to recall.";

        return;
    }


    const counter =
        counterSelect.value;


    speakEnglish(
        "Number " +
        lastCalled.replace("A","") +
        ". Please go to counter " +
        counter
    );

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener("click", async () => {

    const answer =
        confirm(
            "Reset queue?\n\nየተራ ስርዓቱን ዳግም ጀምር?"
        );


    if (!answer) return;


    try {

        await update(
            ref(db, "queue"),
            {
                lastIssued: 0,
                nextToCall: 1,

                current: {
                    number: "",
                    counter: "",
                    calledAt: 0
                },

                tickets: {}
            }
        );


        currentDisplay.innerText =
            "---";

        lastCalled =
            "";

        statusDisplay.innerText =
            "Queue reset / ተራው ዳግም ተጀምሯል";


    } catch(error) {

        console.error(error);

        statusDisplay.innerText =
            "Reset failed.";

    }

});


/* =========================
   LIVE CURRENT NUMBER
========================= */

onValue(
    ref(db, "queue/current"),
    snapshot => {

        const current =
            snapshot.val();


        if (!current || !current.number) {

            currentDisplay.innerText =
                "---";

            return;
        }


        currentDisplay.innerText =
            current.number;

    }
);


/* =========================
   ENGLISH VOICE
========================= */

function speakEnglish(text){

    if (!("speechSynthesis" in window))
        return;


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "en-US";

    speech.rate =
        0.85;

    speech.pitch =
        1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
